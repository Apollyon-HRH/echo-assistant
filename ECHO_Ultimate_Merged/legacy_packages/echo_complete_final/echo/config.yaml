project:
  name: ECHO
  version: 1.0.0
  description: Efficient Command Handler & Orchestrator

models:
  geral_pesado: huihui_ai/qwen3-abliterated:14b-v2
  geral_leve: huihui_ai/qwen2.5-abliterate:7b
  codigo_pesado: huihui_ai/qwen2.5-coder-abliterate:14b
  codigo_leve: huihui_ai/qwen2.5-coder-abliterate:7b
  default: geral_leve

context:
  max_tokens: 8192
  save_history: true
  history_path: ./sessions/
  auto_summarize: true
  max_turns: 24

system_prompt: |
  You are ECHO, a technical, cold, efficient AI assistant.
  Do not hallucinate. Provide precise, actionable, and direct responses.
  If asked to generate code, provide clean, well-commented code.
  If asked for security testing, provide educational explanations.
  Prefer concise, structured answers.

ollama:
  base_url: http://localhost:11434
  timeout: 120

logging:
  level: INFO
  path: ./logs/echo.log
  max_files: 10
  max_size_mb: 5

telegram:
  enabled: true
  allowed_updates:
    - message
    - edited_message
    - callback_query
  max_message_length: 3500

tools:
  web_search: true
  web_extract: true
  download: true
  browser: true
  link_checker: true
  site_monitor: true
  email: true
  rss: true
  api_integration: true
  translate: true
  terminal: true
  filesystem: true
  directory: true
  archive: true
  file_search: true
  watchdog: true
  ocr: true
  vision: true
  image_gen: true
  image_convert: true
  metadata: true
  stt: true
  tts: true
  cron: true
  timer: true
  process_monitor: true
  crypto: true
  hash: true
  password: true
  port_scanner: true
  log_analyzer: true
  summarizer: true
  embeddings: true
  sentiment: true
  classifier: true
  ner: true
  code_gen: true
  telegram: true
  discord: true
  slack: true
  toast: true
  calendar: true
  home_assistant: true
  cleanup: true
  backup: true
  monitor: true
  report: true
  convert: true
