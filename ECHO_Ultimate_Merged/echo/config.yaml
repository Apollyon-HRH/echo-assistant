project:
  name: ECHO
  version: "3.0.0"
  locale: "pt-BR"

models:
  default: "geral_leve"
  geral_pesado: "huihui_ai/qwen3-abliterated:14b-v2"
  geral_leve: "huihui_ai/qwen2.5-abliterate:7b"
  codigo_pesado: "huihui_ai/qwen2.5-coder-abliterate:14b"
  codigo_leve: "huihui_ai/qwen2.5-coder-abliterate:7b"

routing:
  automatic: true
  max_route_history: 8
  code_keywords:
    - código
    - codigo
    - função
    - funcao
    - script
    - algoritmo
    - debug
    - python
    - xml
    - regex
    - parser
    - compilador
    - terminal
    - api
    - json
    - yaml
    - sql
    - refatorar
  heavy_keywords:
    - explique
    - detalhado
    - complexo
    - profundo
    - arquitetura
    - comparar
    - análise
    - analise
    - raciocínio
    - raciocinio
    - longo
    - passo a passo
    - implementação
    - implementacao

context:
  max_tokens: 8192
  max_turns: 24
  summarize_after_turns: 40
  save_history: true
  history_path: "./sessions/"
  memory_path: "./memory/"

logging:
  level: "INFO"
  file: "./logs/echo.log"
  max_bytes: 1048576
  backup_count: 5

timeouts:
  ollama_request: 120
  tool_request: 60
  download_request: 90
  subprocess: 180

system_prompt: |
  Você é o ECHO, um assistente local robusto, cuidadoso e altamente organizado.
  Responda em português quando o usuário escrever em português.
  Sempre que possível, use a melhor ferramenta disponível e explique o resultado com clareza.
  Quando houver ambiguidade, faça suposições explícitas e mostre a lógica.
  Priorize respostas práticas, com estrutura, checkpoints e validação.
  Ao gerar código, inclua validações, tratamento de erro e comentários úteis.
  Ao lidar com arquivos, seja conservador e confirme caminhos quando necessário.
  Nunca invente o resultado de uma ferramenta; se ela falhar, diga isso com transparência.

tools:
  web_search: true
  web_extract: true
  download: true
  browser: true
  link_checker: true
  site_monitor: true
  email: true
  rss: true
  api_integration: true
  translate: true
  terminal: true
  filesystem: true
  directory: true
  archive: true
  file_search: true
  watchdog: true
  ocr: true
  vision: true
  image_gen: true
  image_convert: true
  metadata: true
  stt: true
  tts: true
  cron: true
  timer: true
  process_monitor: true
  crypto: true
  hash: true
  password: true
  port_scanner: true
  log_analyzer: true
  summarizer: true
  embeddings: true
  sentiment: true
  classifier: true
  ner: true
  code_gen: true
  telegram: true
  discord: true
  slack: true
  toast: true
  calendar: true
  home_assistant: true
  cleanup: true
  backup: true
  monitor: true
  report: true
  convert: true
